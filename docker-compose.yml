services:
  bili-rush:
    build: .
    image: bili-vip-rush:latest
    container_name: bili-rush
    # 常驻：每天 11:50 启动一轮抢购（开售时刻以服务器 next_open_at 为准，
    # 11:50 只是起跑线，脚本会校时后等到 12:00）
    command: ["--daemon", "11:50"]
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      # 凭证从同目录 .env 插值注入（.env 不入 git/镜像），镜像不含任何明文：
      - BILI_ACCESS_KEY=${BILI_ACCESS_KEY:-}
      - BILI_CSRF=${BILI_CSRF:-}
      - BILI_SESSDATA=${BILI_SESSDATA:-}
      - BILI_BILI_JCT=${BILI_BILI_JCT:-}
      - BILI_DEDE_USER_ID=${BILI_DEDE_USER_ID:-}
      # 邮件推送（选配，齐备才启用），同样走 .env：
      - BILI_SMTP_HOST=${BILI_SMTP_HOST:-}
      - BILI_SMTP_PORT=${BILI_SMTP_PORT:-}
      - BILI_SMTP_USER=${BILI_SMTP_USER:-}
      - BILI_SMTP_PASS=${BILI_SMTP_PASS:-}
      - BILI_NOTIFY_TO=${BILI_NOTIFY_TO:-}
    volumes:
      - ./logs:/app/logs
      # 仪表盘保存的邮件配置与登录凭证（扫码更新），两个服务共用：
      - ./config/notify.json:/app/config/notify.json
      - ./config/credentials.json:/app/config/credentials.json
      - ./config/pause.json:/app/config/pause.json
    mem_limit: 256m

  # 仪表盘：http://127.0.0.1:8777 （实时状态/抢购记录/调用明细/邮件配置）
  bili-dashboard:
    image: bili-vip-rush:latest
    container_name: bili-dashboard
    # 镜像 ENTRYPOINT 是 python main.py，仪表盘须整段覆盖 entrypoint，
    # 否则 command 会被拼成 main.py 的参数
    entrypoint: ["python", "tools/dashboard.py"]
    command: ["--host", "0.0.0.0", "--port", "8777"]
    restart: unless-stopped
    ports:
      - "8777:8777"
    environment:
      - TZ=Asia/Shanghai
      # 凭证注入同 bili-rush（.env 插值），与抢购服务保持一致
      - BILI_ACCESS_KEY=${BILI_ACCESS_KEY:-}
      - BILI_CSRF=${BILI_CSRF:-}
      - BILI_SESSDATA=${BILI_SESSDATA:-}
      - BILI_BILI_JCT=${BILI_BILI_JCT:-}
      - BILI_DEDE_USER_ID=${BILI_DEDE_USER_ID:-}
    volumes:
      - ./logs:/app/logs
      # 凭证也挂给仪表盘：保存凭证/扫码登录由本服务写入，不挂载会丢
      - ./config/notify.json:/app/config/notify.json
      - ./config/credentials.json:/app/config/credentials.json
      - ./config/pause.json:/app/config/pause.json
    mem_limit: 256m

# 常用操作：
#   docker compose build
#   docker compose run --rm bili-rush --check      # 只读预检
#   docker compose up -d                           # 常驻自动抢
#   docker compose logs -f bili-rush               # 看抢购输出
#   宿主机复盘: python tools/replay.py logs/run_xxx.jsonl
#   或容器内:  docker compose exec bili-rush python tools/replay.py
