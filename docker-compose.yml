services:
  bili-rush:
    build: .
    image: bili-vip-rush:latest
    container_name: bili-rush
    # 常驻：每天 11:50 启动一轮抢购（开售时刻以服务器 next_open_at 为准，
    # 11:50 只是起跑线，脚本会校时后等到 12:00）
    command: ["--daemon", "11:50"]
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      # 凭证注入：镜像不含任何凭证（secrets.py 被 .dockerignore 排除），
      # 必须通过环境变量传入，或挂载本地 config/secrets.py：
      # - BILI_ACCESS_KEY=xxx
      # - BILI_CSRF=xxx
      # - BILI_SESSDATA=xxx
      # - BILI_BILI_JCT=xxx
      # - BILI_DEDE_USER_ID=xxx
      # 邮件推送（选配，齐备才启用）：
      # - BILI_SMTP_HOST=smtp.qq.com
      # - BILI_SMTP_PORT=465
      # - BILI_SMTP_USER=you@qq.com
      # - BILI_SMTP_PASS=授权码
      # - BILI_NOTIFY_TO=me@qq.com
    volumes:
      - ./logs:/app/logs

  # 仪表盘：http://127.0.0.1:8777 （实时状态/抢购记录/调用明细）
  bili-dashboard:
    image: bili-vip-rush:latest
    container_name: bili-dashboard
    command: ["python", "tools/dashboard.py", "--host", "0.0.0.0", "--port", "8777"]
    restart: unless-stopped
    ports:
      - "8777:8777"
    environment:
      - TZ=Asia/Shanghai
      # 凭证注入同上（BILI_ACCESS_KEY 等），与抢购服务保持一致
    volumes:
      - ./logs:/app/logs

# 常用操作：
#   docker compose build
#   docker compose run --rm bili-rush --check      # 只读预检
#   docker compose up -d                           # 常驻自动抢
#   docker compose logs -f bili-rush               # 看抢购输出
#   宿主机复盘: python tools/replay.py logs/run_xxx.jsonl
#   或容器内:  docker compose exec bili-rush python tools/replay.py
